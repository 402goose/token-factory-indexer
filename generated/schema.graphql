  slashedByProofs(where: slashedByProofFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): slashedByProofPage!
  rosterChange(id: String!): rosterChange
  rosterChanges(where: rosterChangeFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): rosterChangePage!
