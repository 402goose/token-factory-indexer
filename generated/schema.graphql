  status: JSON
}

type Query {
  decoded(id: String!): decoded
  decodeds(where: decodedFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): decodedPage!
  deposited(id: String!): deposited
  depositeds(where: depositedFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): depositedPage!
  withdrawn(id: String!): withdrawn
  withdrawns(where: withdrawnFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): withdrawnPage!
  slashed(id: String!): slashed
  slasheds(where: slashedFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): slashedPage!
