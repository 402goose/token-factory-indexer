# token-factory-indexer — Ponder on Fly.io.
#
# SQLite-backed for now; promote to Postgres + Fly PG if/when read load needs it.
# RPC defaults to public Base Sepolia — set PONDER_RPC_URL_84532 to a paid
# endpoint via `fly secrets set` before hitting any meaningful query rate.

app = "tf-indexer"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # Schema namespace per stack generation — Ponder refuses to reuse a schema
  # across different builds. tf=pre-cap stack; tf2=v0.3 stack; tf3=G4 registry; tf4=agent-activity API; tf5=EAS attestation indexing; tf6=verification index; tf7=v2 stack (burn+hybrid); tf8=v2 indexer tuning; tf9=v3 security-hardened core; tf10=v4 (throughput + fee-split); tf11=v5 (keeper reward); tf12=v5+yield; tf13=v6 (protocol-native fee leg).
  DATABASE_SCHEMA = "tf13"

[[mounts]]
  source = "indexer_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  # Liveness check on Ponder's /health (200 once the HTTP server is up). Without
  # this, a Ponder stuck on a dead/rate-limited RPC keeps the machine "started"
  # but unreachable forever (it never binds HTTP) — and the keeper silently gets
  # no data. The check restarts a stuck machine and keeps it healthy once a real
  # RPC is set. Generous grace_period so startup + initial sync isn't killed.
  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "180s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
